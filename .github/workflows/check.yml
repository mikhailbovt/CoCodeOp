      - run: target/release/office schema execution-receipt | diff - schemas/execution-receipt.v1.json
      - run: target/release/office schema runner-profile | diff - schemas/runner-profile.v1.json
      - run: python3 tests/integration/m01.py
      - run: python3 tests/integration/m02_bootstrap.py
      - run: python3 tests/integration/m03_notes.py
      - run: python3 tests/integration/m04_tasks.py
      - run: python3 tests/integration/m06_reviews.py
