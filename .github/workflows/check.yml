name: Verify CoCodeOp

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check advisories licenses sources
      - run: cargo build --locked --release --workspace
      - run: target/release/office schema health | diff - schemas/health.v1.json
      - run: target/release/office schema readiness | diff - schemas/readiness.v1.json
      - run: target/release/office schema doctor | diff - schemas/doctor.v1.json
      - run: target/release/office schema operations-metrics | diff - schemas/operations-metrics.v1.json
      - run: target/release/office schema checkout-host-health | diff - schemas/checkout-host-health.v1.json
      - run: target/release/office schema identity | diff - schemas/identity.v1.json
      - run: target/release/office schema agent | diff - schemas/agent.v1.json
      - run: target/release/office schema runner | diff - schemas/runner.v1.json
      - run: target/release/office schema note | diff - schemas/note.v1.json
      - run: target/release/office schema inbox | diff - schemas/inbox.v1.json
      - run: target/release/office schema inbox-receipt | diff - schemas/inbox-receipt.v1.json
      - run: target/release/office schema inbox-delivery | diff - schemas/inbox-delivery.v1.json
      - run: target/release/office schema context | diff - schemas/context.v1.json
      - run: target/release/office schema channels | diff - schemas/channels.v1.json
      - run: target/release/office schema message | diff - schemas/message.v1.json
      - run: target/release/office schema thread-question | diff - schemas/thread-question.v1.json
      - run: target/release/office schema thread | diff - schemas/thread.v1.json
      - run: target/release/office schema search | diff - schemas/search.v1.json
      - run: target/release/office schema task | diff - schemas/task.v1.json
      - run: target/release/office schema task-explanation | diff - schemas/task-explanation.v1.json
      - run: target/release/office schema run-logs | diff - schemas/run-logs.v1.json
      - run: target/release/office schema task-mutation | diff - schemas/task-mutation.v1.json
