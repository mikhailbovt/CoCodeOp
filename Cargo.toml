[workspace]
members = [
  "apps/office-cli",
  "apps/office-runner",
  "apps/office-server",
  "crates/office-checkout",
  "crates/office-domain",
  "crates/office-protocol",
  "crates/office-store",
  "tests/protocol",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
office-checkout = { path = "crates/office-checkout" }
office-domain = { path = "crates/office-domain" }
office-protocol = { path = "crates/office-protocol" }
office-store = { path = "crates/office-store" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.10.0", features = ["transport-streamable-http-server"] }
rustix = { version = "=1.1.6", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
